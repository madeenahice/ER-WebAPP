  <title>ศูนย์รวมแอปพลิเคชัน</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182338;
      --muted: #718096;
      --line: #e7ebf2;
      --surface: #ffffff;
      --background: #f6f8fc;
      --accent: #4263eb;
      --shadow: 0 12px 32px rgba(32, 52, 89, .07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(91, 124, 250, .10), transparent 34rem),
        var(--background);
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .page { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 0;
    }

    .brand { display: flex; align-items: center; gap: 12px; font-weight: 750; }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 14px;
      background: #4263eb;
      color: white;
      box-shadow: 0 7px 16px rgba(66, 99, 235, .25);
    }

    .brand-mark svg { width: 23px; height: 23px; }
    .brand-name { font-size: 15px; letter-spacing: -.2px; }

    .today {
      color: var(--muted);
      font-size: 13px;
      font-weight: 550;
    }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 48px 0 32px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(30px, 5vw, 44px); letter-spacing: -1.5px; }
    .hero-copy { margin: 12px 0 0; color: var(--muted); font-size: 15px; }

    .search-wrap {
      position: relative;
      width: min(310px, 100%);
      flex: 0 0 auto;
    }

    .search-wrap svg {
      position: absolute;
      top: 50%;
      left: 15px;
      width: 18px;
      height: 18px;
      color: #94a0b3;
      transform: translateY(-50%);
    }

    .search {
      width: 100%;
      height: 48px;
      padding: 0 15px 0 43px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      box-shadow: 0 4px 14px rgba(32, 52, 89, .03);
    }

    .search:focus { border-color: #a7b8ff; box-shadow: 0 0 0 4px rgba(66, 99, 235, .10); }
    .search::placeholder { color: #9aa5b5; }

    .section { padding: 20px 0 18px; }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title { display: flex; align-items: center; gap: 10px; }
    h2 { margin: 0; font-size: 19px; letter-spacing: -.4px; }

    .section-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(66, 99, 235, .10);
    }

    .count { color: #929caf; font-size: 13px; }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .app-card {
      position: relative;
      display: flex;
      min-height: 174px;
      flex-direction: column;
      padding: 19px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 3px 12px rgba(32, 52, 89, .025);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .app-card[hidden] { display: none; }

    a.app-card:hover {
      transform: translateY(-4px);
      border-color: #d5ddf8;
      box-shadow: var(--shadow);
    }

    a.app-card:focus-visible, .search:focus-visible {
      outline: 3px solid rgba(66, 99, 235, .35);
      outline-offset: 3px;
    }

    .app-card.unavailable { background: #fbfcfe; }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; }

    .app-icon {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 15px;
      background: var(--tint);
      color: var(--icon);
    }

    .app-icon svg { width: 25px; height: 25px; }

    .open-icon {
      width: 17px;
      height: 17px;
      color: #a2acbb;
      transition: color .18s ease, transform .18s ease;
    }

    a.app-card:hover .open-icon { color: var(--accent); transform: translate(2px, -2px); }
    .app-name { margin: 17px 0 5px; font-size: 15px; font-weight: 700; }
    .app-description { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }

    .pending-label {
      display: inline-flex;
      align-self: flex-start;
      margin-top: 13px;
      padding: 4px 8px;
      border-radius: 7px;
      background: #fff0f0;
      color: #c62828;
      font-size: 10px;
      font-weight: 650;
    }

    .empty-state {
      display: none;
      padding: 30px;
      border: 1px dashed #d8deea;
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
    }

    footer {
      margin-top: 32px;
      padding: 22px 0 30px;
      border-top: 1px solid var(--line);
      color: #98a2b2;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 900px) {
      .app-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 28px, 520px); }
      .topbar { padding: 10px 0 6px; }
      .brand { gap: 9px; }
      .brand-name { font-size: 14px; }
      .today { display: none; }
      .hero { align-items: stretch; flex-direction: column; gap: 14px; padding: 12px 0 8px; }
      .eyebrow { margin-bottom: 4px; font-size: 10px; line-height: 1.4; letter-spacing: 1px; }
      h1 { font-size: 26px; line-height: 1.35; letter-spacing: -.5px; }
      .hero-copy { margin-top: 5px; font-size: 12px; line-height: 1.5; }
      .search-wrap { width: 100%; }
      .app-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .app-card { min-height: 164px; padding: 15px; border-radius: 15px; }
      .app-icon { width: 43px; height: 43px; border-radius: 13px; }
      .app-name { font-size: 14px; }
    }

    @media (max-width: 370px) {
      .app-grid { grid-template-columns: 1fr; }
      .app-card { min-height: 145px; }
    }
    /* Pastel cat stickers, with a separate task badge on every icon. */
    :root { --accent: #9670ad; --line: #e9deee; --background: #f9f5fc; --ink: #4d3d58; --muted: #83748d; }
    body { background: radial-gradient(ellipse at 12% 0%, #eadcf2, transparent 38rem), var(--background); }
    .brand-mark { width: 48px; height: 48px; background: transparent; box-shadow: 0 5px 14px #9472a329; }
    .brand-mark img, .brand-mark > svg { display: block; border-radius: 14px; }
    .app-icon { width: 74px; height: 74px; border-radius: 23px; background: linear-gradient(145deg, #fffafc, var(--tint)); box-shadow: inset 0 0 0 1px #ffffff, 0 4px 10px #70556809; }
    .app-icon > svg { width: 70px; height: 70px; transition: transform .2s ease; }
    a.app-card:hover .app-icon > svg { transform: rotate(-5deg) translateY(-2px); }
    a.app-card:hover { border-color: #d6bddf; }
    .app-card.featured { background: var(--card-bg); border-color: var(--card-border); }
    a.app-card.featured:hover { border-color: var(--icon); }
    .search:focus { border-color: #bd9dce; box-shadow: 0 0 0 4px #9670ad18; }
    a.app-card:focus-visible, .search:focus-visible { outline-color: #9670ad80; }
    @media (max-width: 640px) {
      .brand-mark, .brand-mark img, .brand-mark > svg { width: 38px; height: 38px; border-radius: 12px; }
      .app-icon { width: 64px; height: 64px; border-radius: 19px; }
      .app-icon > svg { width: 61px; height: 61px; }
    }
    @media (prefers-reduced-motion: reduce) { .app-card, .app-icon > svg, .open-icon { transition: none; } }
  </style>
</head>

          { name: 'ลงชื่อเข้าร่วมกิจกรรม', description: 'ลงทะเบียนเข้าร่วมกิจกรรม', url: 'https://script.google.com/macros/s/AKfycbxQ8MRDZMjn81PO27EvdSGH04LAA42KRRwPQRE9zNvERgSYH2ihh_jxpO9DViiqkRpvxg/exec', icon: 'event', color: '#e27a24', tint: '#fff2e5' },
          { name: 'ครุภัณฑ์', description: 'ข้อมูลและรายการครุภัณฑ์', url: 'https://script.google.com/macros/s/AKfycbzcJVFNcM0a23IToI0_aGoBzBZJFpRg0kBzJYg1Gu31RhUfVZteGFZeSk7EuT7Y-XIC5g/exec', icon: 'asset', color: '#7355d8', tint: '#f0edff' },
          { name: 'CheckTimescan', description: 'ตรวจสอบเวลาและรายการสแกน', url: 'https://madeenahice.github.io/CheckTimescan/', icon: 'clock', color: '#168c91', tint: '#e7f7f7' },
          { name: 'สรุปประชุม', description: 'บันทึกและสรุปการประชุม', icon: 'minutes', color: '#2677c9', tint: '#eaf3ff' },
          { name: 'CSSD', description: 'ระบบงาน CSSD', icon: 'cssd', color: '#d45575', tint: '#fff0f3' }
        ]
      },
      {
        grid: document.getElementById('dashboards-grid'),
        count: document.getElementById('dashboards-count'),
        apps: [
          { name: 'สถิติลา สาย', description: 'ดูข้อมูลวันลาและการมาสาย', url: 'https://script.google.com/macros/s/AKfycbwb87xvGW-8zC3it8kg9P7x_yvtciOXIkHN45MQ3yYgVMi3Y3fVPsbnhSG__OVvjfH2/exec', icon: 'chart', color: '#0c9b79', tint: '#e6f7f2' },
          { name: 'สถิติผู้รับบริการ ER', description: 'แดชบอร์ดสถิติผู้รับบริการห้องฉุกเฉิน', url: 'https://script.google.com/macros/s/AKfycbz-h4WrH7se0I5N36L3Fcixu6YtZrzLvTXiv6_iXmkcLf1-zWmfzhzYhgmP74uilYFJ/exec', icon: 'product', color: '#3971d5', tint: '#edf3ff' }
        ]
      }
    ];

    const catArtwork = "<path d=\"M15 31 13 12Q13 8 17 11L29 20Q39 16 49 20L61 11Q65 8 65 13L63 32Q70 41 65 52Q61 64 39 64Q18 64 13 52Q9 41 15 31Z\" fill=\"var(--fur, #ffe4bc)\" stroke=\"#705568\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><path d=\"m18 17 2 13 8-7m30-6-2 13-8-7\" fill=\"#efb6bc\"/><path d=\"M32 21v7m7-8v8m7-7v7\" stroke=\"#ce9b71\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><ellipse cx=\"24\" cy=\"46\" rx=\"6\" ry=\"3.5\" fill=\"#f3b3bf\"/><ellipse cx=\"54\" cy=\"46\" rx=\"6\" ry=\"3.5\" fill=\"#f3b3bf\"/><path d=\"M26 38v3m26-3v3\" stroke=\"#705568\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><path d=\"m36 44 3 3 3-3Z\" fill=\"#b27b8c\"/><path d=\"M39 47q-4 7-8 2m8-2q4 7 8 2M12 42l-7-2m8 9-8 2m61-9 7-2m-8 9 8 2\" fill=\"none\" stroke=\"#705568\" stroke-width=\"2\" stroke-linecap=\"round\"/>";
    const catFurs = { stroke: '#ffe0e9', calendar: '#ffe1ba', stock: '#eee4dc', event: '#ffe5ce', asset: '#e5dcef', minutes: '#f4eee5', cssd: '#ffe1e8', clock: '#dcebe4', chart: '#eee2cc', product: '#e1e5f5' };
    function cuteIcon(app) {
      return `<svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" style="--fur:${catFurs[app.icon]}"><g transform="translate(1 0)">${catArtwork}</g><circle cx="65" cy="65" r="20" fill="white" stroke="currentColor" stroke-width="1.5"/><svg x="52" y="52" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[app.icon]}</svg></svg>`;
    }

    function createCard(app) {
      const card = document.createElement(app.url ? 'a' : 'article');
      card.className = `app-card${app.url ? '' : ' unavailable'}`;
      card.dataset.search = `${app.name} ${app.description}`.toLocaleLowerCase('th');
      card.style.setProperty('--icon', app.color);
      card.style.setProperty('--tint', app.tint);
      if (app.cardBg) {
        card.classList.add('featured');
        card.style.setProperty('--card-bg', app.cardBg);
        card.style.setProperty('--card-border', app.cardBorder);
      }

      if (app.url) {
        card.href = app.url;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.setAttribute('aria-label', `เปิด ${app.name} ในแท็บใหม่`);
      }

      const top = document.createElement('span');
      top.className = 'card-top';
      top.innerHTML = `<span class="app-icon" aria-hidden="true">${cuteIcon(app)}</span>${app.url ? '<svg class="open-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"></path><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"></path></svg>' : ''}`;

      const name = document.createElement('h3');
      name.className = 'app-name';
      name.textContent = app.name;

      const description = document.createElement('p');
      description.className = 'app-description';
      description.textContent = app.description;

      card.append(top, name, description);
      if (!app.url) {
        const pending = document.createElement('span');
        pending.className = 'pending-label';
        pending.textContent = 'Pending...';
        card.append(pending);
      }
      return card;
    }

    appGroups.forEach(group => {
      group.apps.forEach(app => group.grid.append(createCard(app)));
      group.count.textContent = `${group.apps.length} รายการ`;
    });

    const search = document.getElementById('app-search');
    const emptyState = document.getElementById('empty-state');
    search.addEventListener('input', () => {
      const query = search.value.trim().toLocaleLowerCase('th');
      let visible = 0;
      appGroups.forEach(group => {
        const cards = Array.from(group.grid.children);
        let groupVisible = 0;
        cards.forEach(card => {
          const matches = card.dataset.search.includes(query);
          card.hidden = !matches;
          if (matches) {
            visible++;
            groupVisible++;
          }
        });
        group.grid.closest('.section').hidden = groupVisible === 0;
      });
      emptyState.style.display = visible === 0 ? 'block' : 'none';
    });

    document.getElementById('today').textContent = new Intl.DateTimeFormat('th-TH', {
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    }).format(new Date());
  </script>
</body>
</html>
